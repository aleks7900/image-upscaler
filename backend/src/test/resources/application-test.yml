server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:upscalertest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  storage:
    root: ./target/test-storage
    uploads-dir: ${app.storage.root}/uploads
    results-dir: ${app.storage.root}/results
  gpu:
    worker-url: http://localhost:8000
    concurrency: 1
    timeout-seconds: 10
  upscale:
    default-model: general
    default-scale: 4
    max-file-size-mb: 10
    max-batch-images: 50
    max-image-dimension: 8000
    max-pixel-count: 32000000
    tile-size: 256
    tile-padding: 16
